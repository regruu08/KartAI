repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-claims
        name: Check Forbidden Claims
        entry: python scripts/check_claims.py
        language: system
        pass_filenames: false
        always_run: true
